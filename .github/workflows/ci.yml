# Runs on every pull request and every push to main. A red X on the PR means one of these steps failed:
# open the PR's "Checks" tab (or the repo's "Actions" tab), click the failed run, then the failed step to read its log.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Jobber web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      # Self-checks: scoring maths, eligibility, title filter, tailor checks, keyword matching, query normalising.
      - run: npm test
      # Same build Render runs; fails if any import or JSX is broken.
      - run: npm run build

  scripts:
    name: Python scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/*.py
