# Render Blueprint for Jobber (web/app). Two free services:
#
# 1. jobber-web (static site): the pages. Static sites never sleep, so the app opens instantly.
#    /api/* is rewritten to the jobber service below, so the browser still sees one site
#    (no CORS, and the Content-Security-Policy stays 'self').
# 2. jobber (web service): server.js, needed only for /api/jobs. Free web services sleep after 15 minutes idle,
#    so only the first job search after a quiet spell waits ~50 s. It still serves the full app too, so its
#    old link keeps working.
services:
  - type: web
    name: jobber-web
    runtime: static
    rootDir: web/app
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Absolute URL for link previews (og:image): this static site's own URL. Render usually gives a static site
      # named jobber-web this address; if the dashboard shows a different one, change it here.
      - key: SITE_URL
        value: https://jobber-web.onrender.com
    routes:
      # Order matters: the API rule must come before the catch-all.
      - type: rewrite
        source: /api/*
        destination: https://jobber-z3du.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Same security headers as vercel.json / server.js.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: jobber
    runtime: node
    plan: free
    rootDir: web/app
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
